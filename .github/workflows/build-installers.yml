name: Build Installers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build from
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build from
        required: false
        default: ""
        type: string
      artifact_prefix:
        description: Optional prefix for uploaded artifact names
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The requested ref is resolved to one commit here, and every build job checks out
    # that commit, so a branch that moves mid-run cannot mix commits in one package.
    outputs:
      commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Compile Python sources
        run: python -m compileall openbeat scripts tests

      - name: Install Lua for Resolve behavior tests
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: python -m unittest discover -s tests -v


  # PyInstaller builds only for the Mac it runs on, and numpy, scipy, and numba
  # publish no universal2 wheels, so each runtime is built on its own runner.
  macos_runtime:
    name: Build macOS ${{ matrix.arch }} runtime
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Record source commit
        shell: bash
        env:
          BUILT: macOS ${{ matrix.arch }} runtime
          REQUESTED_REF: ${{ inputs.git_ref }}
          RESOLVED_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$RESOLVED_COMMIT" ]]; then
            echo "::error::Checked out $commit instead of the resolved commit $RESOLVED_COMMIT."
            exit 1
          fi
          if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ && "$REQUESTED_REF" != "$commit" ]]; then
            echo "::error::Checked out $commit instead of the requested commit $REQUESTED_REF."
            exit 1
          fi
          echo "Built the $BUILT from commit \`$commit\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Build runtime
        run: python scripts/build_installers.py --platform macos-runtime

      - name: Check runtime architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          built="$(lipo -archs dist/openbeat)"
          if [[ "$built" != "$ARCH" ]]; then
            echo "::error::Built a runtime for $built instead of $ARCH."
            exit 1
          fi

      - name: Verify bundled runtime with real audio
        run: python scripts/smoke_test_runtime.py dist/openbeat

      # Release publishes every artifact named with artifact_prefix, so the
      # runtimes, which only the package job uses, are named without it.
      - name: Upload runtime
        uses: actions/upload-artifact@v6
        with:
          name: openbeat-macos-runtime-${{ matrix.arch }}
          path: dist/openbeat
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  macos_package:
    name: Build macos installer
    needs: [test, macos_runtime]
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Record source commit
        shell: bash
        env:
          BUILT: macOS installer
          REQUESTED_REF: ${{ inputs.git_ref }}
          RESOLVED_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$RESOLVED_COMMIT" ]]; then
            echo "::error::Checked out $commit instead of the resolved commit $RESOLVED_COMMIT."
            exit 1
          fi
          if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ && "$REQUESTED_REF" != "$commit" ]]; then
            echo "::error::Checked out $commit instead of the requested commit $REQUESTED_REF."
            exit 1
          fi
          echo "Built the $BUILT from commit \`$commit\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Download runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: openbeat-macos-runtime-*
          path: dist/runtimes

      - name: Build installer package
        run: >-
          python scripts/build_installers.py --platform macos
          --macos-runtime arm64=dist/runtimes/openbeat-macos-runtime-arm64/openbeat
          --macos-runtime x86_64=dist/runtimes/openbeat-macos-runtime-x86_64/openbeat

      - name: Check package contents
        run: |
          expanded="$RUNNER_TEMP/expanded"
          pkgutil --expand-full dist/installers/OpenBeat-macos-*.pkg "$expanded"
          grep -F 'hostArchitectures="arm64,x86_64"' "$expanded/Distribution"
          for arch in arm64 x86_64; do
            runtime="$expanded/OpenBeat-component.pkg/Payload/payloads/$arch/Modules/OpenBeat/bin/openbeat"
            built="$(lipo -archs "$runtime")"
            if [[ "$built" != "$arch" ]]; then
              echo "::error::The package's $arch runtime is built for $built."
              exit 1
            fi
          done

      - name: Install the package on this runner
        run: sudo installer -verbose -pkg dist/installers/OpenBeat-macos-*.pkg -target /

      - name: Verify the installed runtime with real audio
        run: |
          python scripts/smoke_test_runtime.py "$HOME/Library/Application Support/Blackmagic Design/DaVinci Resolve/Fusion/Modules/OpenBeat/bin/openbeat"
          if [[ -e "/Library/Application Support/OpenBeat" ]]; then
            echo "::error::The installer left its staged payload behind."
            exit 1
          fi

      - name: Show installer log
        if: failure()
        run: grep -i openbeat /var/log/install.log | tail -n 100

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix && format('{0}-{1}', inputs.artifact_prefix, 'OpenBeat-macos-installer') || 'OpenBeat-macos-installer' }}
          path: dist/installers/*.pkg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Build windows installer
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.commit }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Record source commit
        shell: bash
        env:
          BUILT: Windows installer
          REQUESTED_REF: ${{ inputs.git_ref }}
          RESOLVED_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$RESOLVED_COMMIT" ]]; then
            echo "::error::Checked out $commit instead of the resolved commit $RESOLVED_COMMIT."
            exit 1
          fi
          if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ && "$REQUESTED_REF" != "$commit" ]]; then
            echo "::error::Checked out $commit instead of the requested commit $REQUESTED_REF."
            exit 1
          fi
          echo "Built the $BUILT from commit \`$commit\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Build installer bundle
        run: python scripts/build_installers.py --platform windows

      - name: Verify bundled runtime with real audio
        run: python scripts/smoke_test_runtime.py dist/openbeat/openbeat.exe

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix && format('{0}-{1}', inputs.artifact_prefix, 'OpenBeat-windows-installer') || 'OpenBeat-windows-installer' }}
          path: dist/installers/*installer.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
